<script>

//if(!debug) $.alert('<?php echo lang('group_edit_tips');?>', 4);

var maxgid = <?php echo $maxgid;?>;

var jform = $("#form");
var jsubmit = $("#submit");

jform.on('submit', function(){
    jsubmit.prop('disabled', true).addClass('disabled');
    jsubmit.html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ' + jsubmit.data('loading-text'));
    
    var postdata = jform.serialize();
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            jsubmit.removeClass('btn-primary').addClass('btn-success');
            jsubmit.html(message);
            setTimeout(function() {
                window.location.reload();
            }, 1000);
        } else {
            jsubmit.prop('disabled', false).removeClass('disabled');
            jsubmit.html(jsubmit.data('default-text') || '<?php echo lang('confirm');?>');
            $.alert(message, -1, {isError: true});
        }
    });
    return false;
});

// 编辑
var jarrlist = $('.arrlist');
jarrlist.on('click', 'a.row_edit', function() {
    var jtr = $(this).closest('tr');
    var rowid = jtr.attr('rowid');
    window.location = xn.url('group-update-'+rowid);
});

// 删除
jarrlist.on('click', 'a.row_delete', function() {
    var jtr = $(this).closest('tr');
    var rowid = jtr.attr('rowid');
    
    $.confirm("<?php echo lang('confirm_delete');?>", function() {
        jtr.fadeOut(function() {
            jtr.remove();
        });
    });
    
    return false;
});

// 增加
$('a.row_add').on('click', function() {
    var jclone = jarrlist.find('tr').last().clone();
    jclone.insertAfter(jarrlist.find('tr').last());
    var jgid = jclone.find('input[name^="_gid"]');
    var rowid = ++maxgid;
    jgid.val(rowid);
    jclone.attr('rowid', rowid);
    
    // 清空值
    jclone.find('input').not('[name^="_gid"]').val('');
    
    // 修改 [] 中的值为 rowid
    jclone.find('input').attr_name_index(rowid);
    
    // 添加动画效果
    jclone.hide().fadeIn();
    
    return false;
});


$('#nav li.nav-item-user').addClass('active');

</script>
