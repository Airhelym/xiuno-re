<script ajax-eval="true">

// 接受传参
var args = args || {jmodal: null, callback: null, arg: null};
var jmodal = args.jmodal;
var callback = args.callback;
var arg = args.arg;
var jthreadlist = $(arg);
var tidarr = jthreadlist.find('input[name="modtid"]:checked').map(function() {
    return this.value;
}).get();


var jform = $('#mod_delete_form');
var jsubmit = jform.find('button[type="submit"]');
var jcancel = jform.find('button[type="button"]');
var jtotal = jform.find('span.total');
jtotal.text(tidarr.length);

jform.on('submit', function() {
    jform.reset();
    jsubmit.prop('disabled', true).addClass('disabled');
    jsubmit.html('<span class="spinner-border spinner-border-sm" role="status"></span> ' + jsubmit.data('loading-text'));
    
    var postdata = jform.serializeObject();
    postdata.tidarr = tidarr;
    
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            jsubmit.removeClass('btn-primary').addClass('btn-success');
            jsubmit.html(message);
            setTimeout(function() {
                if(jmodal) {
                    var modal = bootstrap.Modal.getInstance(jmodal[0]);
                    if(modal) {
                        modal.hide();
                    }
                }
                if(callback) callback(message);
                window.location.reload();
            }, 1000);
        } else {
            jsubmit.prop('disabled', false).removeClass('disabled');
            jsubmit.html(jsubmit.data('default-text') || '<?php echo lang('confirm');?>');
            alert(message);
        }
    });
    return false;
});

jcancel.on('click', function() {
    if(jmodal) {
        var modal = bootstrap.Modal.getInstance(jmodal[0]);
        if(modal) {
            modal.hide();
        }
    }
});

	
</script>
