<script>
var jform = $('#form');
var jsubmit = $('#submit');

jform.on('submit', function() {
    // 保存按钮原始文本
    var originalText = jsubmit.text();
    // 显示提交状态
    jsubmit.prop('disabled', true).html('<span class="spinner-border spinner-border-sm" role="status"></span> ' + jsubmit.data('loading-text'));
    
    var postdata = jform.serialize();
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            // 检查消息内容，判断是否有数据变动
            if (message.indexOf('没有数据变动') !== -1 || message.indexOf('No data changed') !== -1) {
                // 没有数据变动，恢复按钮原始文本
                jsubmit.prop('disabled', false).text(originalText);
                $.alert(message, 3, {size: "md"});
            } else {
                // 有数据变动，显示成功消息
                var alert = $.alert(message, 3, {size: "md"});
                jsubmit.prop('disabled', false).text('<?php echo lang("update_successfully");?>');
                setTimeout(function() {
                    window.location.reload();
                }, 3000);
            }
        } else if(xn.is_number(code)) {
            $.alert(message, 0, {size: "md", isError: true});
            jsubmit.prop('disabled', false).text(originalText);
        } else {
            var jinput = jform.find('[name="'+code+'"]');
            jinput.addClass('is-invalid');
            jinput.next('.invalid-feedback').text(message);
            jinput.focus();
            $.alert(message, 0, {size: "md", isError: true});
            jsubmit.prop('disabled', false).text(originalText);
        }
    });
    return false;
});
