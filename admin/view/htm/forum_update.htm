<script>
var jform = $("#form");
var jsubmit = $("#submit");
jform.on('submit', function(){
    if (!jform[0].checkValidity()) {
        jform[0].reportValidity();
        return false;
    }
    jform.reset();
    jsubmit.prop('disabled', true).html('<span class="spinner-border spinner-border-sm" role="status"></span> ' + jsubmit.data('loading-text'));
    var postdata = jform.serialize();
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            var alert = $.alert(message, 3, {size: "md"});
            jsubmit.prop('disabled', false).text(message);
            setTimeout(function() {
                window.location.reload();
            }, 3000);
        } else {
            $.alert(message, 0, {size: "md", isError: true});
            jsubmit.prop('disabled', false);
        }
    });
    return false;
});

var jaccesslist = $('#accesslist_div');

// toggle
jform.find('input[name="accesson"]').on('click', function() {
    jaccesslist.toggle('fast');
    return true;
});

// 全选
jaccesslist.find('tr').each(function(k, v) {
    var jtr = $(v);
    jtr.find('td').eq(0).find('input[type="checkbox"]').on('click', function() {
        var checked = $(this).prop('checked');
        jtr.find('input[type="checkbox"]').prop('checked', checked);
    });
});
